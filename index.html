<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="referrer" content="same-origin" />
    <meta name="description" content="crayonplayer，支持视频链接解析、片名聚合搜索、选集与多线路播放。" />
    <link rel="icon" type="image/svg+xml" href="/brand/crayonplayer-icon.svg" />
    <title>crayonplayer</title>
    <script>
      const embed = new URLSearchParams(window.location.search).get('embed');
      document.documentElement.dataset.embedded = String(embed === '1' ||
        (embed !== '0' && (/^\/parse\/?$/.test(window.location.pathname) || window.self !== window.top)));
      let theme = 'dark';
      try {
        const saved = window.localStorage.getItem('crayonplayer-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia?.('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch {}
      document.documentElement.dataset.theme = theme;
    </script>
    <style>html[data-embedded=true]{background:#000}</style>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <main id="player-page">
      <header class="site-header">
        <a class="brand" href="/" aria-label="crayonplayer 首页">
          <img src="/brand/crayonplayer-icon.svg" alt="" width="36" height="36" />
          <span>crayonplayer</span>
        </a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换白天模式" aria-pressed="true">
          <svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.4 14A8.5 8.5 0 0 1 10 3.6 8.5 8.5 0 1 0 20.4 14Z"/></svg>
        </button>
      </header>
      <form id="source-form" class="toolbar">
        <label class="sr-only" for="source-url">片名或视频地址</label>
        <div class="source-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="source-url" type="text" required maxlength="8192" placeholder="搜索片名，或粘贴视频链接" autocomplete="off" />
        </div>
        <button class="load" type="submit">搜索 / 播放<span aria-hidden="true">↗</span></button>
      </form>
      <div class="player-frame"><div id="player"></div></div>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="catalog-results" aria-label="搜索结果与分集" hidden></section>
      <footer class="foot"><a href="https://github.com/Swebersmith/CrayonPlayer" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></footer>
    </main>
    <script type="module" src="/demo.ts"></script>
  </body>
</html>
