<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crayon Player 接入示例</title>
<style>body{margin:24px;background:#101714;color:white;font-family:system-ui}#player{width:100%;max-width:960px;aspect-ratio:16/9}</style>
<div id="player"></div>
<!-- Serve this file beside dist/ over HTTP(S); change the video URL below. -->
<script src="../dist/crayon-player.iife.js"></script>
<script>
  const player = CrayonPlayer.createCrayonPlayer({
    container: '#player',
    url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
    title: 'Crayon Player',
    storageKey: 'demo:episode-1',
    // Enable after deploying the matching service on this origin:
    // prepareMedia: '/api/player/prepare',
  });
  window.addEventListener('pagehide', () => player.destroy());
</script>
</html>
